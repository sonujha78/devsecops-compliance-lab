---
- name: Run OpenSCAP CIS compliance scan (post-remediation)
  hosts: servers
  become: yes
  vars:
    ssg_path: "/opt/ssg/scap-security-guide-0.1.78/ssg-ubuntu2204-ds.xml"
    profile: "xccdf_org.ssgproject.content_profile_cis_level1_server"
  tasks:
    - name: Run OpenSCAP scan (post-remediation)
      command: >
        oscap xccdf eval
        --profile {{ profile }}
        --results /tmp/{{ inventory_hostname }}-post-results.xml
        --report /tmp/{{ inventory_hostname }}-post-report.html
        {{ ssg_path }}
      register: scan_result
      failed_when: scan_result.rc > 2
      changed_when: false

    - name: Fetch HTML report to control machine
      fetch:
        src: "/tmp/{{ inventory_hostname }}-post-report.html"
        dest: "openscap/post-remediation-reports/{{ inventory_hostname }}-post-report.html"
        flat: yes

    - name: Fetch XML results to control machine
      fetch:
        src: "/tmp/{{ inventory_hostname }}-post-results.xml"
        dest: "openscap/post-remediation-reports/{{ inventory_hostname }}-post-results.xml"
        flat: yes
