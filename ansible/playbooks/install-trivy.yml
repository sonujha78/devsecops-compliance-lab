---
- name: Install Trivy on all servers
  hosts: servers
  become: yes
  tasks:
    - name: Install prerequisites
      apt:
        name:
          - wget
          - apt-transport-https
          - gnupg
          - ca-certificates
        state: present

    - name: Add Trivy GPG key
      apt_key:
        url: https://aquasecurity.github.io/trivy-repo/deb/public.key
        state: present

    - name: Add Trivy apt repository
      apt_repository:
        repo: "deb https://aquasecurity.github.io/trivy-repo/deb {{ ansible_distribution_release }} main"
        state: present

    - name: Install Trivy
      apt:
        name: trivy
        state: present
        update_cache: yes

    - name: Verify Trivy installation
      command: trivy --version
      register: trivy_version
      changed_when: false

    - name: Show Trivy version
      debug:
        var: trivy_version.stdout_lines
